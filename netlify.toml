# Netlify build configuration.
#
# Redirects are NOT declared here. They live in `public/_redirects` (the old
# WordPress URL map) and the Astro adapter appends its own on-demand-route
# rules to that same file during the build. Netlify applies the first matching
# rule, so keeping one ordered file avoids two systems disagreeing.
#
# Secrets are never stored here. Set DO_I_WORK_PASSWORD and AUTH_SECRET in
# Site configuration -> Environment variables (see README).

[build]
  # `npm run build` warns about unresolved TODO_CLIENT blanks; `build:launch`
  # FAILS on them. While the site is pre-launch it is deliberately the warning
  # version, because the whole point of the scaffold is that it deploys and can
  # be reviewed with the holes visible.
  #
  # AT LAUNCH: switch this to `npm run build:launch`. From then on a missing
  # client detail breaks the deploy instead of shipping a `[NEEDS: ...]` label
  # to the public site. Run `npm run todos` for what is outstanding.
  command = "npm run build"
  publish = "dist"

[build.environment]
  # astro@7 requires Node >=22.12.0 — a Node 20 build fails at install. "22"
  # resolves to the latest 22.x, so security patches are still picked up.
  # Keep in step with node-version in .github/workflows/ci.yml.
  NODE_VERSION = "22"

[[headers]]
  # The password gate sets its own no-store headers at render time; this is the
  # belt-and-braces version for anything Netlify serves on that path.
  for = "/do-i-work/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-store, max-age=0"
